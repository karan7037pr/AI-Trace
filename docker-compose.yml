services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitrace-postgres
    environment:
      POSTGRES_DB: aitrace
      POSTGRES_USER: aitrace
      POSTGRES_PASSWORD: aitrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  postgres_data:
